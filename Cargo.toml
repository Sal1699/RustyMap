[package]
name = "rustymap"
version = "0.66.2"
edition = "2021"
description = "A Rust port of nmap for network exploration and security auditing"
license = "MIT"
repository = "https://github.com/Sal1699/RustyMap"
homepage = "https://Sal1699.github.io/RustyMap/"
readme = "README.md"
keywords = ["network", "scanner", "nmap", "security", "pentest"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "rustymap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ipnet = "2"
hickory-resolver = "0.24"
futures = "0.3"
anyhow = "1"
colored = "2"
chrono = "0.4"
pnet = "0.34"
rand = "0.8"
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ctrlc = "3"
tera = "1"
regex = "1"
once_cell = "1"
rhai = { version = "1.18", features = ["sync"] }
aes-gcm = "0.10"
argon2 = "0.5"
rpassword = "7"
base64 = "0.22"
toml = "0.8"
tiny_http = "0.12"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
x509-parser = "0.16"
ratatui = "0.28"
crossterm = "0.28"
indicatif = "0.17"
btleplug = "0.11"
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "cookies"] }
plist = "1"
printpdf = { version = "0.7", default-features = false }
crc32c = "0.6"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
async-trait = "0.1"
md-5 = "0.10"
md4 = "0.10"
sha1 = "0.10"
hmac = "0.12"
des = "0.8"
russh = "0.45"
russh-keys = "0.45"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parsers"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Bump opt-level on test/dev builds — the huge clap-derive Cli
# struct blows the default Windows debug stack in some tests
# (detect_preview ones go through Cli::try_parse_from). opt=1 is
# enough to inline the parser branches and dodge the recursion blow.
[profile.test]
opt-level = 1
[profile.dev]
opt-level = 1
